name: Validate Olist dataset contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run schema validator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
